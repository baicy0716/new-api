name: Deploy NewAPI to PRODUCTION (manual)

# 高风险操作 — 仅 workflow_dispatch 手动触发
#
# 两种用法：
#   ① 正常发版：image_tag 留空，会用最新的 :subscription-lock（rolling）
#   ② 回滚：填写历史日期 tag，例如 subscription-lock-20260428-abc1234
#
# 镜像 tag 不变（GHCR 上每次构建都生成一个 immutable 日期-SHA tag），
# 所以可以随时回滚到任意历史点。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（留空=用 :subscription-lock；回滚=填具体 subscription-lock-YYYYMMDD-SHA7）'
        required: false
        default: ''
      confirm:
        description: '请输入 "deploy-to-prod" 确认（防误触）'
        required: true
        default: ''

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify confirmation
        if: inputs.confirm != 'deploy-to-prod'
        run: |
          echo "::error ::必须输入 'deploy-to-prod' 确认"
          exit 1

      - name: Resolve image tag
        id: tag
        run: |
          T="${{ inputs.image_tag }}"
          if [ -z "$T" ]; then
            T="subscription-lock"
          fi
          echo "value=$T" >> $GITHUB_OUTPUT
          echo "→ 即将部署 tag: $T"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if ! docker manifest inspect "ghcr.io/${{ github.repository_owner }}/new-api:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error ::镜像不存在 ghcr.io/${{ github.repository_owner }}/new-api:${IMAGE_TAG}"
            exit 1
          fi
          echo "✓ 镜像存在"

      - name: Backup current state + Deploy
        env:
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          ssh -i ~/.ssh/deploy "$HOST" bash -s << EOF
          set -e
          cd /opt/newapi-frontend
          # 1. 备份当前 .env (含旧 IMAGE_TAG，便于一键回滚)
          PREV_TAG=\$(grep IMAGE_TAG .env 2>/dev/null | cut -d= -f2 || echo "subscription-lock")
          TS=\$(date +%s)
          cp .env .env.bak-\$TS 2>/dev/null || true
          echo "→ 旧 IMAGE_TAG: \$PREV_TAG"
          echo "→ 新 IMAGE_TAG: ${IMAGE_TAG}"

          # 2. 备份当前数据库
          docker exec newapi-frontend sh -c 'cp /data/one-api.db /data/one-api.db.predeploy-\$TS' 2>/dev/null || true

          # 3. 切换 IMAGE_TAG + 拉镜像 + 重启
          echo "IMAGE_TAG=${IMAGE_TAG}" > .env
          echo "→ 拉取镜像"
          docker compose pull 2>&1 | tail -3
          echo "→ 重启容器"
          docker compose up -d 2>&1 | tail -3
          sleep 8

          # 4. 健康检查
          echo "→ 容器状态"
          docker ps --filter name=newapi-frontend --format 'table {{.Names}}\t{{.Status}}'
          echo "→ 接口健康"
          if ! curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/api/status | grep -q '^200\$'; then
            echo "❌ 健康检查失败，自动回滚"
            echo "IMAGE_TAG=\$PREV_TAG" > .env
            docker compose pull 2>&1 | tail -2
            docker compose up -d 2>&1 | tail -2
            exit 1
          fi
          echo "✓ 部署成功，新 tag: ${IMAGE_TAG}（旧 tag 保存在 .env.bak-\$TS）"
          EOF

      - name: Notify result
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          STATUS: ${{ job.status }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
            curl -sS -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT_ID" \
              -d text="$ICON NewAPI 生产部署 $STATUS · tag=$IMAGE_TAG · $GITHUB_RUN_URL" || true
          fi
