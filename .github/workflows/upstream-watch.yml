name: Upstream watch

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --repo QuantumNous/new-api --limit 1 --json tagName,name,publishedAt,isPrerelease --jq '.[0]')
          TAG=$(echo "$LATEST" | jq -r '.tagName')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$(echo "$LATEST" | jq -r '.name')" >> $GITHUB_OUTPUT
          echo "published=$(echo "$LATEST" | jq -r '.publishedAt')" >> $GITHUB_OUTPUT
          echo "is_prerelease=$(echo "$LATEST" | jq -r '.isPrerelease')" >> $GITHUB_OUTPUT
          echo "url=https://github.com/QuantumNous/new-api/releases/tag/$TAG" >> $GITHUB_OUTPUT

      - name: Get fork-vs-upstream behind count
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(gh api repos/QuantumNous/new-api/compare/main...baicy0716:new-api:subscription-group-lock --jq '.behind_by')
          echo "behind=$AHEAD" >> $GITHUB_OUTPUT

      - name: Restore previous state from cache
        # 用 cache 而不是 artifact，因为 artifact v4 默认不跨 run（要 run-id 显式指定）
        # cache 的 restore-keys 自动跨 run 模糊匹配，最适合状态持久化
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/state
          key: upstream-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-state-

      - name: Compare + write new state
        id: decide
        run: |
          mkdir -p ${{ github.workspace }}/state
          cd ${{ github.workspace }}/state
          NEW="${{ steps.upstream.outputs.tag }}"
          PREV=$(jq -r '.last_seen_tag // ""' upstream-state.json 2>/dev/null || echo "")
          echo "Previous: '$PREV'  New: '$NEW'"
          if [ -z "$PREV" ]; then
            echo "notify=first_run" >> $GITHUB_OUTPUT
          elif [ "$NEW" != "$PREV" ]; then
            echo "notify=new_release" >> $GITHUB_OUTPUT
          else
            echo "notify=no" >> $GITHUB_OUTPUT
          fi
          jq -n --arg tag "$NEW" --arg ts "$(date -u +%FT%TZ)" '{last_seen_tag: $tag, last_check: $ts}' > upstream-state.json
          cat upstream-state.json

      - name: Notify on new release
        if: steps.decide.outputs.notify == 'new_release'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TAG: ${{ steps.upstream.outputs.tag }}
          NAME: ${{ steps.upstream.outputs.name }}
          IS_PRE: ${{ steps.upstream.outputs.is_prerelease }}
          URL: ${{ steps.upstream.outputs.url }}
          BEHIND: ${{ steps.commits.outputs.behind }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG secrets not configured, skip notify"
            exit 0
          fi
          if [ "$IS_PRE" = "true" ]; then
            ICON="🟡"; TYPE="(prerelease)"
          else
            ICON="🟢"; TYPE="(stable)"
          fi
          MSG="$ICON QuantumNous/new-api new release $TYPE\nTag: $TAG\nName: $NAME\nFork behind upstream/main: $BEHIND commits\nURL: $URL"
          curl -sS -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT_ID" \
            --data-urlencode "text=$MSG" \
            -d disable_web_page_preview=true | jq -r '.ok'

      - name: Summary
        run: |
          echo "## Upstream watch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Latest tag: ${{ steps.upstream.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Prerelease: ${{ steps.upstream.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "- Published: ${{ steps.upstream.outputs.published }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fork behind: ${{ steps.commits.outputs.behind }} commits" >> $GITHUB_STEP_SUMMARY
          echo "- Decision: ${{ steps.decide.outputs.notify }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.upstream.outputs.url }}" >> $GITHUB_STEP_SUMMARY
