name: Upstream watch (检查 QuantumNous/new-api 新发版)

# 每天 UTC 01:00 = 北京 09:00 跑一次
# 状态保存在 .upstream-state.json（artifact），新版有更新就 TG 告警

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:   # 手动触发用于测试

permissions:
  contents: read
  actions: write   # 用于读写 artifact

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取 upstream 最新 release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 拿 upstream 最新 release（包括 prerelease，因为 v1.0.0-rc.x 也算）
          LATEST=$(gh release list --repo QuantumNous/new-api --limit 1 \
            --json tagName,name,publishedAt,isPrerelease,url \
            --jq '.[0]')
          TAG=$(echo "$LATEST" | jq -r '.tagName')
          NAME=$(echo "$LATEST" | jq -r '.name')
          PUBLISHED=$(echo "$LATEST" | jq -r '.publishedAt')
          PRERELEASE=$(echo "$LATEST" | jq -r '.isPrerelease')
          URL=$(echo "$LATEST" | jq -r '.url')
          echo "TAG=$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "is_prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: 拉取 upstream main 最近 commit 数（看活跃度）
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(gh api repos/QuantumNous/new-api/compare/main...baicy0716:new-api:subscription-group-lock \
            --jq '.behind_by')
          echo "behind=$AHEAD" >> $GITHUB_OUTPUT
          echo "fork 落后 upstream main: $AHEAD 个 commit"

      - name: 下载上次记录的 tag（artifact 持久化）
        id: prev
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: upstream-state
          path: .

      - name: 比对 + 决定要不要告警
        id: decide
        run: |
          NEW_TAG="${{ steps.upstream.outputs.tag }}"
          PREV_TAG=$(cat .upstream-state.json 2>/dev/null | jq -r '.last_seen_tag // ""')
          echo "上一次记录的 tag: ${PREV_TAG:-(首次运行)}"
          echo "上游当前最新 tag: $NEW_TAG"

          if [ -z "$PREV_TAG" ]; then
            echo "notify=first_run" >> $GITHUB_OUTPUT
          elif [ "$NEW_TAG" != "$PREV_TAG" ]; then
            echo "notify=new_release" >> $GITHUB_OUTPUT
          else
            echo "notify=no" >> $GITHUB_OUTPUT
          fi
          # 写入新状态（无论变没变都更新）
          jq -n --arg tag "$NEW_TAG" --arg ts "$(date -u +%FT%TZ)" \
            '{last_seen_tag: $tag, last_check: $ts}' > .upstream-state.json
          cat .upstream-state.json

      - name: 上传新状态（保留到下次跑用）
        uses: actions/upload-artifact@v4
        with:
          name: upstream-state
          path: .upstream-state.json
          retention-days: 90
          overwrite: true

      - name: TG 通知（仅在有新版 + secrets 配齐时发）
        if: steps.decide.outputs.notify == 'new_release'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TAG: ${{ steps.upstream.outputs.tag }}
          NAME: ${{ steps.upstream.outputs.name }}
          IS_PRE: ${{ steps.upstream.outputs.is_prerelease }}
          URL: ${{ steps.upstream.outputs.url }}
          BEHIND: ${{ steps.commits.outputs.behind }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "⚠️ TG_BOT_TOKEN/TG_CHAT_ID 未配置，跳过通知"
            exit 0
          fi
          ICON=$([ "$IS_PRE" = "true" ] && echo "🟡" || echo "🟢")
          TYPE=$([ "$IS_PRE" = "true" ] && echo "(预发布)" || echo "(正式版)")
          MSG="$ICON QuantumNous/new-api 有新版 $TYPE
新版本: $TAG
标题: $NAME
fork 当前落后 upstream main: $BEHIND 个 commit
URL: $URL

是否升级 → 走 docs/NEWAPI-FORK-CICD.md 第 3-4 节"
          curl -sS -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT_ID" \
            -d text="$MSG" \
            -d disable_web_page_preview=true | jq -r '.ok // "fail"'

      - name: 输出 Summary（GitHub UI 看）
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Upstream watch 报告

          | 项 | 值 |
          |---|---|
          | 上游最新 tag | \`${{ steps.upstream.outputs.tag }}\` |
          | 是否预发布 | ${{ steps.upstream.outputs.is_prerelease }} |
          | 发布时间 | ${{ steps.upstream.outputs.published }} |
          | fork 落后 upstream main | ${{ steps.commits.outputs.behind }} commits |
          | 本次决策 | ${{ steps.decide.outputs.notify }} |
          | URL | ${{ steps.upstream.outputs.url }} |
          EOF
